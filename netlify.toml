[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /img/<slug>/<id>.jpg -> image envoyée depuis l'admin
[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/img?k=:splat"
  status = 200

# /c/mon-chantier -> page publique du chantier
[[redirects]]
  from = "/c/*"
  to = "/chantier.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/invitation.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/chantier.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
